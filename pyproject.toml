[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "juniper-lm1"
version = "0.1.0"
description = "Juniper LM 1: a controlled modernization study of the original GPT-2 124M checkpoint"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Cinqic Research" }]
# Exact versions are pinned in requirements.lock.txt; these are the direct dependencies.
dependencies = [
  "torch==2.14.0",
  "transformers==5.17.0",
  "safetensors==0.8.0",
  "tokenizers==0.23.2",
  "accelerate==1.15.0",
  "pyyaml",
]

[project.optional-dependencies]
train = ["datasets", "trl", "datasketch"]
dev = ["pytest"]

[project.scripts]
juniper = "juniper_lm1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
