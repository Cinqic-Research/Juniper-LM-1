name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    name: verification (Ubuntu, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bubblewrap with runner-scoped AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sysctl kernel.apparmor_restrict_unprivileged_userns
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1"
          profile_source=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile_source"
          sudo install -m 0644 "$profile_source" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          grep -Fq "bwrap" /sys/kernel/security/apparmor/profiles
          /usr/bin/bwrap --version
          /usr/bin/bwrap --unshare-all \
            --ro-bind /usr /usr \
            --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 \
            --symlink usr/bin /bin \
            --proc /proc --dev /dev -- /usr/bin/true
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          python -m pip install -e '.[dev]'
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify frozen benchmark suites
        run: |
          juniper bench verify --suite v1
          juniper bench verify --suite v1.1
          juniper bench verify --suite v1.2
